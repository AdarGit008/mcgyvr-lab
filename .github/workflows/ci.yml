name: ci
on:
  push:
  pull_request:
  # Manual only: the product's full gate. The product's own CI runs it on every
  # product pull request; here it is for checking product work from the lab.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The lab's own gate, on every push and pull request.
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      # The product submodule is fetched at depth 1 (fetch-depth applies to
      # submodules too). The editable install of the product builds from a
      # shallow clone; its version then reads as a dev build of that commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      # Same action, pin and versions as the product's workflow.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: install
        run: uv sync --frozen
      - name: check (lint, typecheck, tests, guard self-tests)
        run: make check

  # The product's full gate inside product/, set up the way the product's own
  # workflow sets it up (pinned JS toolchain on PATH, then `make check`).
  product-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: product/package-lock.json
      - name: install the product's pinned JS toolchain
        working-directory: product
        run: |
          npm ci
          echo "$GITHUB_WORKSPACE/product/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.28"
          python-version: "3.12"
      - name: product check
        run: make product-check
